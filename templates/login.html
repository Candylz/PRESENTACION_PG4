<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MotoRepuestos San Benito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #8d8d8d; /* Un fondo gris muy sutil y limpio */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5 col-lg-4">
            
            <div class="card shadow border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Iniciar Sesión</h2>
                    <p class="text-muted small">MotoRepuestos San Hillarion   </p>
                </div>
                
                {% if error %}
                <div class="alert alert-danger py-2 small text-center rounded-3" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form action="/login" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Usuario</label>
                        <input type="text" name="usuario" class="form-control rounded-3" placeholder="Digite su usuario" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Contraseña</label>
                        <input type="password" name="contrasenia" class="form-control rounded-3" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-dark w-100 fw-bold rounded-3 py-2 mt-2">
                        Ingresar al Sistema
                    </button>
                </form>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
